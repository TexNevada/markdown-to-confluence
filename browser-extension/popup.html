<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Markdown → Confluence</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <form id="form" novalidate>
        <header>
            <h1>Markdown → Confluence</h1>
        </header>

        <label class="field">
            <span class="field-label">Output target</span>
            <select id="target">
                <option value="html-pre">Rich HTML — code as &lt;pre&gt;</option>
                <option value="html-macro">Rich HTML — Confluence macros</option>
                <option value="wiki">Confluence wiki markup</option>
            </select>
        </label>

        <p class="hint" id="hint"></p>

        <label class="field">
            <span class="field-label">
                Markdown
                <span class="counter" id="counter"></span>
            </span>
            <textarea id="input" rows="10" spellcheck="false"
                placeholder="Paste Markdown here, or copy it in Obsidian and reopen this popup."></textarea>
        </label>

        <div class="actions">
            <button type="submit" id="copy" class="primary">Convert &amp; copy</button>
            <button type="button" id="clear">Clear</button>
            <span class="status" id="status" role="status"></span>
        </div>

        <details id="preview-wrap">
            <summary>Converted output</summary>
            <pre class="preview" id="preview"></pre>
        </details>
    </form>

    <script type="module" src="popup.js"></script>
</body>
</html>
